services:
  app:
    container_name: app
    profiles: ["main"]
    build:
      context: .
      dockerfile: Dockerfile
    image: my-settlement:latest
    command: python -m main
    env_file:
      - .env 
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  db:
    container_name: db
    profiles: ["main"]
    image: postgres:16
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "1488:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net
    restart: unless-stopped

  admin:
    container_name: admin
    profiles: ["admin"]
    build:
      context: .
      dockerfile: Dockerfile
    image: my-settlement:latest
    command: python -m admin-entrypoint
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "3480:3480"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  db-dumper:
    image: prodrigestivill/postgres-backup-local
    container_name: db-dumper
    profiles: ["tools"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - SCHEDULE=0 */12 * * *
      - BACKUP_KEEP_DAYS=3
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=1
    volumes:
      - ./backups/postgres:/backups
    networks:
      - app-net
    depends_on:
      db:
        condition: service_healthy

  # remote-backup:
  #   image: ghcr.io/nicotsx/zerobyte:v0.18
  #   container_name: remote-backup
  #   restart: unless-stopped
  #   cap_add:
  #     - SYS_ADMIN
  #   ports:
  #     - "4096:4096"
  #   devices:
  #     - /dev/fuse:/dev/fuse
  #   environment:
  #     - TZ=Europe/Berlin
  #   volumes:
  #     - /etc/localtime:/etc/localtime:ro
  #     - /var/lib/zerobyte:/var/lib/zerobyte

  docs:
    container_name: docs
    profiles: ["tools"]
    build:
      context: ./docs
      target: serve
    ports:
      - "3333:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - app-net
    restart: unless-stopped

volumes:
  db-data:

networks:
  app-net:
    driver: bridge