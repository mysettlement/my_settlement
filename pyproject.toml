[project]
name = "my-settlement"
version = "0.1.0"
description = "A feature-rich text-based MMORPG for Telegram group chats."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.25.0",
    "apscheduler==3.11.2",
    "arrow==1.4.0",
    "asyncpg==0.31.0",
    "fastapi==0.129.0",
    "fluentogram[cli,stubs]==1.2.1",
    "itsdangerous==2.2.0",
    "langdetect==1.0.9",
    "pydantic-settings==2.12.0",
    "pymorphy3==2.0.6",
    "pytz==2025.2",
    "rapidfuzz==3.14.3",
    "requests==2.32.5",
    "sqladmin==0.23.0",
    "sqlalchemy==2.0.45",
    "timezonefinder==8.2.1",
    "tzdata==2025.3",
    "uvicorn==0.40.0",
    "watchfiles==1.1.1",
    "wordfreq==3.1.1",
]

[dependency-groups]
visualizer = [
    "cairosvg",
    "sqlalchemy-data-model-visualizer",
]

[tool.uv]
package = false
required-version = ">=0.11.11"
