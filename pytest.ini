[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    unit: Fast tests without real database or external integrations
    integration: Tests that require a real PostgreSQL database
    e2e: End-to-end and application bootstrap smoke tests
    slow: Slow-running tests
addopts =
    --strict-markers
    --cov=app
    --cov=main
    --cov=admin_entrypoint
    --cov-report=term-missing
    --cov-report=xml
filterwarnings =
    ignore:arguments\.__init__ got an unexpected keyword argument 'lineno'.*:DeprecationWarning:fluent_compiler\.codegen
    ignore:arguments\.__init__ got an unexpected keyword argument 'col_offset'.*:DeprecationWarning:fluent_compiler\.codegen
    ignore:Module\.__init__ got an unexpected keyword argument 'lineno'.*:DeprecationWarning:fluent_compiler\.codegen
    ignore:Module\.__init__ got an unexpected keyword argument 'col_offset'.*:DeprecationWarning:fluent_compiler\.codegen
